<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Симулятор захватов — расширенный</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #0b1a2a; }
  #toolbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: rgba(15,25,40,.95); padding: 8px 10px; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.5); border: 1px solid rgba(255,255,255,.08);
  }
  #toolbar button {
    background: #1e2a3a; color: #dfe8f2; border: 1px solid #2f4056;
    padding: 7px 11px; border-radius: 8px; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #2a3a4f; }
  #toolbar button.active { background: #2e7d32; border-color: #4caf50; color: #fff; }
  #toolbar button.danger { background: #7a1f1f; border-color: #a83a3a; }
  #side {
    position: absolute; top: 70px; right: 12px; z-index: 1000; width: 250px;
    background: rgba(15,25,40,.95); color: #dfe8f2; padding: 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
    font-size: 13px;
  }
  #side h3 { margin: 0 0 8px; font-size: 14px; }
  #side label { display: block; margin: 8px 0 4px; color: #9fb2c8; }
  #side input, #side select {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #2f4056;
    background: #0e1826; color: #dfe8f2; font-size: 13px;
  }
  #side .row { display: flex; gap: 6px; margin-top: 8px; }
  #side .row button {
    flex: 1; padding: 7px; border-radius: 6px; border: 1px solid #2f4056;
    background: #1e2a3a; color: #dfe8f2; cursor: pointer;
  }
  .leaflet-container { background: #0b1a2a; }
  .unit-popup button {
    background: #2e7d32; color: #fff; border: none; padding: 6px 10px;
    border-radius: 4px; cursor: pointer; margin-top: 4px; font-size: 12px;
  }
  .unit-popup button.fire { background: #b71c1c; }
</style>
</head>
<body>
<div id="map"></div>

<div id="toolbar">
  <button data-mode="select" class="active">🖱 Выбор</button>
  <button data-mode="territory">🟩 Территория</button>
  <button data-mode="unit">⚔ Отряд</button>
  <button data-mode="artillery">🎯 Артиллерия</button>
  <button data-mode="fort">🏰 Укрепление</button>
  <button data-mode="erase">🗑 Удалить</button>
  <button id="clearAll" class="danger">💥 Очистить</button>
</div>

<div id="side">
  <h3>Сторона</h3>
  <select id="sideSelect"></select>
  <label>Имя отряда</label>
  <input id="nameInput" placeholder="напр. 1-я рота" />
  <div class="row">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
  </div>
</div>

<script>
/* ============================================================
   1. КАРТА — Waymorphic Dark (без ключа)
   ============================================================ */
const map = L.map('map', {
  worldCopyJump: true, minZoom: 2, maxZoom: 10
}).setView([25, 30], 3);

// Waymorphic: бесплатные векторные тайлы, но для Leaflet нужен raster-совместимый слой.
// Используем бесплатный растровый источник с тёмным CSS-фильтром.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

// Тёмный фильтр поверх светлой карты — визуально как штабная карта
const style = document.createElement('style');
style.innerHTML = `.leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(0.9); }`;
document.head.appendChild(style);

/* ============================================================
   2. СТОРОНЫ
   ============================================================ */
const sides = [
  { id: 'red',   name: 'Красные',   color: '#e53935' },
  { id: 'blue',  name: 'Синие',     color: '#1e88e5' },
  { id: 'green', name: 'Зелёные',   color: '#43a047' },
  { id: 'gold',  name: 'Золотые',   color: '#f9a825' }
];
const sideSelect = document.getElementById('sideSelect');
sideSelect.innerHTML = sides.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
function getSide(id) { return sides.find(s => s.id === id) || sides[0]; }

/* ============================================================
   3. СЛОИ
   ============================================================ */
const territoriesLayer = L.layerGroup().addTo(map);
const unitsLayer       = L.layerGroup().addTo(map);
const fortsLayer       = L.layerGroup().addTo(map);
const drawLayer        = L.layerGroup().addTo(map);

/* ============================================================
   4. СОСТОЯНИЕ
   ============================================================ */
const state = {
  territories: [], // { sideId, latlngs, polygonRef }
  units:       [], // { id, sideId, type, name, lat, lng, strength, radius, cooldown, markerRef, zoneRef }
  forts:       []  // { sideId, name, lat, lng, radius, markerRef, zoneRef }
};

let mode = 'select';
let tempPoints = [];
let tempPolyline = null;

document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#toolbar button[data-mode]')
    .forEach(b => b.classList.toggle('active', b === btn));
  cancelDrawing();
});

function cancelDrawing() {
  tempPoints = [];
  drawLayer.clearLayers();
  tempPolyline = null;
}

/* ============================================================
   5. РИСОВАНИЕ ТЕРРИТОРИИ
   ============================================================ */
map.on('click', e => {
  const ll = e.latlng;
  if (mode === 'territory') {
    tempPoints.push([ll.lat, ll.lng]);
    L.circleMarker(ll, { radius: 3, color: '#fff', fillColor: '#fff', fillOpacity: 1 }).addTo(drawLayer);
    if (tempPolyline) drawLayer.removeLayer(tempPolyline);
    tempPolyline = L.polyline(tempPoints, { color: '#fff', weight: 1, dashArray: '4,4' }).addTo(drawLayer);
  }
});

map.on('dblclick', () => {
  if (mode === 'territory' && tempPoints.length >= 3) {
    const sideId = sideSelect.value;
    const t = { sideId, latlngs: tempPoints.slice() };
    state.territories.push(t);
    drawTerritory(t);
    cancelDrawing();
  }
});

function drawTerritory(t) {
  const side = getSide(t.sideId);
  const poly = L.polygon(t.latlngs, {
    color: side.color, weight: 2, fillColor: side.color, fillOpacity: 0.30
  }).addTo(territoriesLayer);
  poly._data = t;
  t.polygonRef = poly;
  poly.on('click', ev => {
    if (mode === 'erase') {
      territoriesLayer.removeLayer(poly);
      state.territories = state.territories.filter(x => x !== t);
    } else if (mode === 'select') {
      L.popup().setLatLng(ev.latlng)
        .setContent(`<b>${side.name}</b><br>Территория`)
        .openOn(map);
    }
  });
}

/* ============================================================
   6. СОЗДАНИЕ ЮНИТОВ (отряд / артиллерия / укрепление)
   ============================================================ */
let unitIdCounter = 0;

map.on('click', e => {
  const ll = e.latlng;
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim() || 'Без названия';

  if (mode === 'unit') {
    createUnit(sideId, 'infantry', name, ll.lat, ll.lng);
  } else if (mode === 'artillery') {
    createUnit(sideId, 'artillery', name, ll.lat, ll.lng);
  } else if (mode === 'fort') {
    createFort(sideId, name, ll.lat, ll.lng);
  }
});

function createUnit(sideId, type, name, lat, lng) {
  const isArt = type === 'artillery';
  const unit = {
    id: ++unitIdCounter,
    sideId, type, name, lat, lng,
    strength: isArt ? 30 : 100,
    radius: isArt ? 0.8 : 1.5,       // градусы (приблизительно)
    attackRadius: isArt ? 3.0 : 1.5, // артиллерия стреляет дальше
    cooldown: 0,
    moving: false,
    moveTarget: null,
    markerRef: null,
    zoneRef: null
  };
  state.units.push(unit);
  renderUnit(unit);
}

function renderUnit(u) {
  const side = getSide(u.sideId);
  const isArt = u.type === 'artillery';
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:${isArt ? 28 : 34}px;height:${isArt ? 28 : 34}px;border-radius:50%;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:${isArt ? 14 : 16}px;box-shadow:0 2px 10px rgba(0,0,0,.6);
      transform:translate(-50%,-50%);
    ">${isArt ? '🎯' : '⚔'}</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([u.lat, u.lng], { icon }).addTo(unitsLayer);
  marker._unit = u;
  u.markerRef = marker;

  // Зона атаки / контроля
  const zone = L.circle([u.lat, u.lng], {
    radius: u.attackRadius * 111000, // градусы -> метры (грубо)
    color: side.color, weight: 1,
    fillColor: side.color, fillOpacity: 0.08,
    dashArray: '4,4'
  }).addTo(unitsLayer);
  u.zoneRef = zone;

  // Popup
  const popupHtml = `<div class="unit-popup">
    <b>${u.name}</b> (${side.name})<br>
    ${u.type === 'artillery' ? 'Артиллерия' : 'Отряд'}<br>
    Сила: ${u.strength}<br>
    <button onclick="startMove(${u.id})">Двигаться</button>
    ${u.type === 'artillery' ? `<button class="fire" onclick="startFire(${u.id})">Огонь</button>` : ''}
  </div>`;
  marker.bindPopup(popupHtml);

  marker.on('click', () => {
    if (mode === 'erase') {
      removeUnit(u);
    }
  });
}

function createFort(sideId, name, lat, lng) {
  const fort = { sideId, name, lat, lng, radius: 2.0, markerRef: null, zoneRef: null };
  state.forts.push(fort);
  const side = getSide(sideId);
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:30px;height:30px;border-radius:6px;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;box-shadow:0 2px 10px rgba(0,0,0,.6);
      transform:translate(-50%,-50%);
    ">🏰</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([lat, lng], { icon }).addTo(fortsLayer);
  marker._fort = fort;
  fort.markerRef = marker;
  const zone = L.circle([lat, lng], {
    radius: fort.radius * 111000,
    color: side.color, weight: 1, fillColor: side.color, fillOpacity: 0.06
  }).addTo(fortsLayer);
  fort.zoneRef = zone;
  marker.bindPopup(`<b>${fort.name}</b> (${side.name})<br>Укрепление`);
  marker.on('click', () => {
    if (mode === 'erase') {
      fortsLayer.removeLayer(marker);
      fortsLayer.removeLayer(zone);
      state.forts = state.forts.filter(f => f !== fort);
    }
  });
}

/* ============================================================
   7. ДВИЖЕНИЕ С ВРЕМЕНЕМ, ЗАВИСЯЩИМ ОТ МАСШТАБА
   ============================================================ */
window.startMove = function(unitId) {
  const u = state.units.find(x => x.id === unitId);
  if (!u || u.moving) return;
  map.closePopup();
  // Режим "ожидания точки назначения"
  pendingMoveUnit = u;
  mode = 'select'; // чтобы клик не создал новый юнит
  document.querySelectorAll('#toolbar button[data-mode]')
    .forEach(b => b.classList.toggle('active', b.dataset.mode === 'select'));
  L.popup().setLatLng([u.lat, u.lng])
    .setContent('Кликните точку назначения на карте')
    .openOn(map);
};

let pendingMoveUnit = null;
let pendingFireUnit = null;

map.on('click', e => {
  if (pendingMoveUnit) {
    const u = pendingMoveUnit;
    pendingMoveUnit = null;
    const target = [e.latlng.lat, e.latlng.lng];
    const start = [u.lat, u.lng];

    // Расстояние в градусах -> км (грубо)
    const distDeg = Math.sqrt(
      Math.pow(target[0] - start[0], 2) + Math.pow(target[1] - start[1], 2)
    );
    const distKm = distDeg * 111;

    // Время в пути зависит от масштаба: на крупном зуме (ближе) — медленнее
    const zoomFactor = Math.max(0.5, 4 / map.getZoom()); // zoom 4 => 1x, zoom 8 => 0.5x
    const speedKmPerSec = 20 * zoomFactor; // км в секунду игрового времени
    const travelSec = Math.max(1, distKm / speedKmPerSec);

    u.moving = true;
    u.moveTarget = target;

    // Анимация: линейная интерполяция за travelSec секунд
    const steps = Math.min(60, Math.max(10, Math.floor(travelSec * 2)));
    let step = 0;
    const interval = setInterval(() => {
      step++;
      const t = step / steps;
      const lat = start[0] + (target[0] - start[0]) * t;
      const lng = start[1] + (target[1] - start[1]) * t;
      u.lat = lat; u.lng = lng;
      u.markerRef.setLatLng([lat, lng]);
      u.zoneRef.setLatLng([lat, lng]);

      if (step >= steps) {
        clearInterval(interval);
        u.moving = false;
        u.moveTarget = null;
        checkCaptures(u);
        checkBattles();
      }
    }, (travelSec * 1000) / steps);
  }
});

/* ============================================================
   8. АРТИЛЛЕРИЙСКИЙ ОГОНЬ
   ============================================================ */
window.startFire = function(unitId) {
  const u = state.units.find(x => x.id === unitId);
  if (!u || u.type !== 'artillery' || u.cooldown > 0) return;
  map.closePopup();
  pendingFireUnit = u;
  L.popup().setLatLng([u.lat, u.lng])
    .setContent('Кликните точку для удара')
    .openOn(map);
};

map.on('click', e => {
  if (!pendingFireUnit) return;
  const u = pendingFireUnit;
  pendingFireUnit = null;

  const blastLat = e.latlng.lat, blastLng = e.latlng.lng;
  const blastRadiusDeg = 1.0; // зона поражения

  // Визуал взрыва
  const blast = L.circle([blastLat, blastLng], {
    radius: blastRadiusDeg * 111000,
    color: '#ff5722', fillColor: '#ff5722', fillOpacity: 0.4, weight: 2
  }).addTo(drawLayer);
  setTimeout(() => drawLayer.removeLayer(blast), 1500);

  // Уничтожаем всех в радиусе (включая своих — война есть война)
  const toRemove = [];
  state.units.forEach(other => {
    if (other === u) return;
    const d = Math.sqrt(Math.pow(other.lat - blastLat, 2) + Math.pow(other.lng - blastLng, 2));
    if (d <= blastRadiusDeg) toRemove.push(other);
  });
  toRemove.forEach(removeUnit);

  // Перезарядка
  u.cooldown = 5; // секунд
  const cdInterval = setInterval(() => {
    u.cooldown--;
    if (u.cooldown <= 0) clearInterval(cdInterval);
  }, 1000);
});

/* ============================================================
   9. ЗАХВАТ ТЕРРИТОРИЙ И БОИ
   ============================================================ */
function checkCaptures(movedUnit) {
  // Проверяем, внутри ли чужой территории
  state.territories.forEach(t => {
    if (t.sideId === movedUnit.sideId) return;
    if (isPointInPolygon([movedUnit.lat, movedUnit.lng], t.latlngs)) {
      // Захват
      t.sideId = movedUnit.sideId;
      const newSide = getSide(t.sideId);
      t.polygonRef.setStyle({
        color: newSide.color,
        fillColor: newSide.color
      });
    }
  });
}

// Простая проверка точки в полигоне (ray casting)
function isPointInPolygon(point, polygon) {
  const x = point[0], y = point[1];
  let inside = false;
  for (let i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
    const xi = polygon[i][0], yi = polygon[i][1];
    const xj = polygon[j][0], yj = polygon[j][1];
    const intersect = ((yi > y) !== (yj > y)) &&
      (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function checkBattles() {
  // Попарно проверяем отряды разных сторон
  for (let i = 0; i < state.units.length; i++) {
    for (let j = i + 1; j < state.units.length; j++) {
      const a = state.units[i], b = state.units[j];
      if (a.sideId === b.sideId) continue;
      const d = Math.sqrt(Math.pow(a.lat - b.lat, 2) + Math.pow(a.lng - b.lng, 2));
      const contactRadius = (a.attackRadius + b.attackRadius) * 0.5;
      if (d <= contactRadius) {
        // Бой: сравниваем силу
        if (a.strength > b.strength) {
          b.strength -= 30;
          a.strength -= 10;
        } else if (b.strength > a.strength) {
          a.strength -= 30;
          b.strength -= 10;
        } else {
          a.strength -= 20; b.strength -= 20;
        }
        // Уничтожение при нулевой силе
        if (a.strength <= 0) removeUnit(a);
        if (b.strength <= 0) removeUnit(b);
        // Обновляем попап
        [a, b].forEach(u => {
          if (u.markerRef && u.markerRef.getPopup()) {
            const side = getSide(u.sideId);
            u.markerRef.setPopupContent(`<div class="unit-popup">
              <b>${u.name}</b> (${side.name})<br>
              ${u.type === 'artillery' ? 'Артиллерия' : 'Отряд'}<br>
              Сила: ${u.strength}
            </div>`);
          }
        });
      }
    }
  }
}

function removeUnit(u) {
  if (u.markerRef) unitsLayer.removeLayer(u.markerRef);
  if (u.zoneRef) unitsLayer.removeLayer(u.zoneRef);
  state.units = state.units.filter(x => x !== u);
}

/* ============================================================
   10. СОХРАНЕНИЕ / ЗАГРУЗКА (упрощённо)
   ============================================================ */
document.getElementById('saveBtn').onclick = () => {
  const data = {
    sides,
    territories: state.territories.map(t => ({ sideId: t.sideId, latlngs: t.latlngs })),
    units: state.units.map(u => ({
      id: u.id, sideId: u.sideId, type: u.type, name: u.name,
      lat: u.lat, lng: u.lng, strength: u.strength, radius: u.radius,
      attackRadius: u.attackRadius, cooldown: u.cooldown
    })),
    forts: state.forts.map(f => ({ sideId: f.sideId, name: f.name, lat: f.lat, lng: f.lng, radius: f.radius }))
  };
  localStorage.setItem('conquestSave', JSON.stringify(data));
  alert('Сохранено');
};

document.getElementById('loadBtn').onclick = () => {
  const raw = localStorage.getItem('conquestSave');
  if (!raw) return alert('Нет сохранений');
  const data = JSON.parse(raw);
  // Очистка
  territoriesLayer.clearLayers(); unitsLayer.clearLayers(); fortsLayer.clearLayers();
  state.territories = []; state.units = []; state.forts = []; unitIdCounter = 0;

  data.territories.forEach(t => { state.territories.push(t); drawTerritory(t); });
  data.units.forEach(u => {
    const nu = { ...u, moving: false, moveTarget: null, markerRef: null, zoneRef: null };
    state.units.push(nu);
    renderUnit(nu);
    if (u.id > unitIdCounter) unitIdCounter = u.id;
  });
  data.forts.forEach(f => createFort(f.sideId, f.name, f.lat, f.lng));
};

document.getElementById('clearAll').onclick = () => {
  if (!confirm('Очистить карту?')) return;
  territoriesLayer.clearLayers(); unitsLayer.clearLayers(); fortsLayer.clearLayers();
  state.territories = []; state.units = []; state.forts = [];
};

/* ============================================================
   11. ПЕРИОДИЧЕСКАЯ ПРОВЕРКА БОЁВ
   ============================================================ */
setInterval(() => {
  checkBattles();
  // Автоматический захват территорий, если отряды уже стоят на вражеской земле
  state.units.forEach(u => checkCaptures(u));
}, 2000);
</script>
</body>
</html>
