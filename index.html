<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вологда — тактический симулятор</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #101820; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85); }

  #toolbar {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;
    background: rgba(15,25,40,.95); padding: 7px 9px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 24px rgba(0,0,0,.5);
    max-width: 95vw;
  }
  #toolbar button {
    background: #1e2a3a; color: #dfe8f2; border: 1px solid #2f4056;
    padding: 6px 9px; border-radius: 8px; cursor: pointer; font-size: 12px;
  }
  #toolbar button:hover { background: #2a3a4f; }
  #toolbar button.active { background: #2e7d32; border-color: #4caf50; color: #fff; }
  #toolbar button.danger { background: #7a1f1f; border-color: #a83a3a; }

  #side {
    position: absolute; top: 64px; right: 10px; z-index: 1000; width: 240px;
    background: rgba(15,25,40,.96); color: #dfe8f2; padding: 12px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08); font-size: 12px;
  }
  #side h3 { margin: 0 0 6px; font-size: 13px; }
  #side label { display: block; margin: 6px 0 3px; color: #9fb2c8; }
  #side input, #side select {
    width: 100%; padding: 5px 7px; border-radius: 6px; border: 1px solid #2f4056;
    background: #0e1826; color: #dfe8f2; font-size: 12px;
  }
  #side .row { display: flex; gap: 5px; margin-top: 6px; }
  #side .row button {
    flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #2f4056;
    background: #1e2a3a; color: #dfe8f2; cursor: pointer; font-size: 11px;
  }
  #status {
    position: absolute; bottom: 10px; left: 10px; z-index: 1000;
    background: rgba(15,25,40,.95); color: #cfd9e5; padding: 8px 11px;
    border-radius: 8px; font-size: 11px; border: 1px solid rgba(255,255,255,.08);
    max-width: 360px; line-height: 1.5;
  }
  .unit-popup button {
    background: #2e7d32; color: #fff; border: none; padding: 5px 9px;
    border-radius: 4px; cursor: pointer; margin-top: 4px; font-size: 11px;
  }
  .unit-popup button.fire { background: #b71c1c; }
</style>
</head>
<body>

<div id="map"></div>

<div id="toolbar">
  <button data-mode="select" class="active">🖱 Выбор</button>
  <button data-mode="unit">⚔ Отряд</button>
  <button data-mode="artillery">🎯 Артиллерия</button>
  <button data-mode="fort">🏰 Укрепление</button>
  <button data-mode="erase">🗑 Удалить</button>
  <button id="clearAll" class="danger">💥 Очистить</button>
</div>

<div id="side">
  <h3>Сторона</h3>
  <select id="sideSelect"></select>

  <label>Имя отряда</label>
  <input id="nameInput" placeholder="напр. 1-я рота" />

  <label>Скорость (км/мин, игровое)</label>
  <input id="speedInput" type="number" step="0.05" value="0.15" />

  <div class="row">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
  </div>
</div>

<div id="status">
  Вологда. Территории остаются за захватчиком. Противник, проходящий по вашей земле, перекрашивает её в свой цвет.
</div>

<script>
/* ============================================================
   1. КАРТА — Вологда
   ============================================================ */
const VOLOGDA = [59.2205, 39.8915];

const map = L.map('map', {
  worldCopyJump: true,
  minZoom: 12,
  maxZoom: 18,
  zoomControl: true
}).setView(VOLOGDA, 14);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

/* ============================================================
   2. СТОРОНЫ
   ============================================================ */
const sides = [
  { id: 'red',   name: 'Красные',   color: '#e53935' },
  { id: 'blue',  name: 'Синие',     color: '#1e88e5' },
  { id: 'green', name: 'Зелёные',   color: '#43a047' },
  { id: 'gold',  name: 'Золотые',   color: '#f9a825' }
];
const sideSelect = document.getElementById('sideSelect');
sideSelect.innerHTML = sides.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
function getSide(id) { return sides.find(s => s.id === id) || sides[0]; }

/* ============================================================
   3. ГЕОМЕТРИЯ
   ============================================================ */
function metersToLatLng(lat, lng, dxM, dyM) {
  const p = map.project([lat, lng], 18);
  return map.unproject([p.x + dxM, p.y - dyM], 18);
}
function circleToPolygon(center, radiusM, points = 24) {
  const latlngs = [];
  for (let i = 0; i < points; i++) {
    const angle = (i / points) * 2 * Math.PI;
    const dx = Math.cos(angle) * radiusM;
    const dy = Math.sin(angle) * radiusM;
    latlngs.push(metersToLatLng(center.lat, center.lng, dx, dy));
  }
  return latlngs;
}

/* ============================================================
   4. СОСТОЯНИЕ
   ============================================================ */
const state = {
  units: [],
  forts: [],
  patches: []  // { sideId, lat, lng, radius, layerRef }
};
let unitIdCounter = 0;
let mode = 'select';

/* Слой территорий (снизу) */
const territoryLayer = L.layerGroup().addTo(map);
const unitsLayer     = L.layerGroup().addTo(map);
const fortsLayer     = L.layerGroup().addTo(map);
const drawLayer      = L.layerGroup().addTo(map);

document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  document.querySelectorAll('#toolbar button[data-mode]')
    .forEach(b => b.classList.toggle('active', b === btn));
});

/* ============================================================
   5. ТЕРРИТОРИЯ — постоянные пятна
   ============================================================ */
const PATCH_RESOLUTION = 150; // минимальное расстояние между пятнами (м)

function stampPatch(sideId, lat, lng, radius) {
  // Проверяем: не покрыто ли это место уже пятном этого же цвета с похожим радиусом
  const existingSame = state.patches.find(p =>
    p.sideId === sideId &&
    map.distance([lat, lng], [p.lat, p.lng]) < PATCH_RESOLUTION &&
    Math.abs(p.radius - radius) < radius * 0.4
  );
  if (existingSame) return;

  // Ищем чужие пятна, которые накрываются нашим — их удаляем / перекрашиваем
  const enemies = state.patches.filter(p => {
    if (p.sideId === sideId) return false;
    const d = map.distance([lat, lng], [p.lat, p.lng]);
    return d < radius + p.radius * 0.6;
  });

  enemies.forEach(e => {
    // Перекрашиваем: удаляем чужое пятно, ставим на его место своё
    territoryLayer.removeLayer(e.layerRef);
    state.patches = state.patches.filter(p => p !== e);
    // На месте чужого пятна ставим своё
    addPatch(sideId, e.lat, e.lng, e.radius);
  });

  // Ставим новое пятно
  addPatch(sideId, lat, lng, radius);

  // Перепроверяем окружение — если что-то отрезано, отдаём врагу
  checkEncirclement();
}

function addPatch(sideId, lat, lng, radius) {
  const side = getSide(sideId);
  const pts = circleToPolygon({ lat, lng }, radius, 24);
  const poly = L.polygon(pts, {
    color: side.color, weight: 1,
    fillColor: side.color, fillOpacity: 0.35
  }).addTo(territoryLayer);
  const patch = { sideId, lat, lng, radius, layerRef: poly };
  state.patches.push(patch);
  return patch;
}

/* ============================================================
   6. СОЗДАНИЕ ОТРЯДОВ
   ============================================================ */
map.on('click', e => {
  if (mode === 'unit') createUnit('infantry', e.latlng.lat, e.latlng.lng);
  else if (mode === 'artillery') createUnit('artillery', e.latlng.lat, e.latlng.lng);
  else if (mode === 'fort') createFort(e.latlng.lat, e.latlng.lng);
});

function createUnit(type, lat, lng) {
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim() ||
               (type === 'artillery' ? 'Батарея' : 'Отряд');
  const isArt = type === 'artillery';
  const u = {
    id: ++unitIdCounter,
    sideId, type, name, lat, lng,
    strength: isArt ? 40 : 100,
    maxStrength: isArt ? 40 : 100,
    controlRadius: 300,        // радиус «штампа» территории
    attackRadius: isArt ? 400 : 600,  // дальность удара (у артиллерии уменьшено)
    cooldown: 0,
    moving: false,
    lastStamp: 0,
    markerRef: null,
    zoneRef: null
  };
  state.units.push(u);
  renderUnit(u);
  // Первый штамп при создании
  stampPatch(u.sideId, u.lat, u.lng, u.controlRadius);
}

function renderUnit(u) {
  const side = getSide(u.sideId);
  const isArt = u.type === 'artillery';
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:${isArt ? 26 : 30}px;height:${isArt ? 26 : 30}px;border-radius:50%;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:${isArt ? 13 : 15}px;box-shadow:0 2px 10px rgba(0,0,0,.7);
      transform:translate(-50%,-50%);
    ">${isArt ? '🎯' : '⚔'}</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([u.lat, u.lng], { icon, zIndexOffset: 1000 }).addTo(unitsLayer);
  u.markerRef = marker;

  const zone = L.circle([u.lat, u.lng], {
    radius: u.attackRadius,
    color: side.color, weight: 1,
    fillColor: side.color, fillOpacity: 0.06,
    dashArray: '3,4'
  }).addTo(unitsLayer);
  u.zoneRef = zone;

  const popup = `<div class="unit-popup">
    <b>${u.name}</b> (${side.name})<br>
    ${isArt ? 'Артиллерия' : 'Пехота'}<br>
    Сила: ${u.strength}/${u.maxStrength}<br>
    <button onclick="startMove(${u.id})">Двигаться</button>
    ${isArt ? `<button class="fire" onclick="startFire(${u.id})">Огонь</button>` : ''}
  </div>`;
  marker.bindPopup(popup);
  marker.on('click', () => { if (mode === 'erase') removeUnit(u); });
}

function createFort(lat, lng) {
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim() || 'Укрепление';
  const fort = { sideId, name, lat, lng, radius: 400, markerRef: null, zoneRef: null };
  state.forts.push(fort);
  const side = getSide(sideId);
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:28px;height:28px;border-radius:5px;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;box-shadow:0 2px 10px rgba(0,0,0,.7);
      transform:translate(-50%,-50%);
    ">🏰</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([lat, lng], { icon, zIndexOffset: 900 }).addTo(fortsLayer);
  fort.markerRef = marker;
  const zone = L.circle([lat, lng], {
    radius: fort.radius,
    color: side.color, weight: 1, fillColor: side.color, fillOpacity: 0.12
  }).addTo(fortsLayer);
  fort.zoneRef = zone;
  marker.bindPopup(`<b>${fort.name}</b> (${side.name})`);
  marker.on('click', () => { if (mode === 'erase') removeFort(fort); });
  // Укрепление тоже штампует территорию
  stampPatch(sideId, lat, lng, fort.radius);
}

function removeUnit(u) {
  if (u.markerRef) unitsLayer.removeLayer(u.markerRef);
  if (u.zoneRef) unitsLayer.removeLayer(u.zoneRef);
  state.units = state.units.filter(x => x !== u);
}
function removeFort(f) {
  if (f.markerRef) fortsLayer.removeLayer(f.markerRef);
  if (f.zoneRef) fortsLayer.removeLayer(f.zoneRef);
  state.forts = state.forts.filter(x => x !== f);
}

/* ============================================================
   7. ДВИЖЕНИЕ — с оставлением пятен территории
   ============================================================ */
let pendingMoveUnit = null;
let pendingFireUnit = null;

window.startMove = function(id) {
  const u = state.units.find(x => x.id === id);
  if (!u || u.moving) return;
  map.closePopup();
  pendingMoveUnit = u;
  mode = 'select';
  document.querySelectorAll('#toolbar button[data-mode]')
    .forEach(b => b.classList.toggle('active', b.dataset.mode === 'select'));
  updateStatus('Кликните точку назначения');
};

map.on('click', e => {
  if (pendingMoveUnit) {
    const u = pendingMoveUnit;
    pendingMoveUnit = null;
    moveUnitTo(u, e.latlng.lat, e.latlng.lng);
  }
});

function moveUnitTo(u, targetLat, targetLng) {
  const startLat = u.lat, startLng = u.lng;
  const distKm = map.distance([startLat, startLng], [targetLat, targetLng]) / 1000;

  const speedKmMin = parseFloat(document.getElementById('speedInput').value) || 0.15;
  const speedKmSec = speedKmMin / 60;
  const travelSec = Math.max(3, distKm / speedKmSec);
  // Ускорение для играбельности: реальное время = travelSec / 8
  const realSec = Math.max(2, travelSec / 8);

  u.moving = true;
  const steps = Math.min(200, Math.max(20, Math.floor(realSec * 10)));
  let step = 0;

  const interval = setInterval(() => {
    step++;
    const t = step / steps;
    u.lat = startLat + (targetLat - startLat) * t;
    u.lng = startLng + (targetLng - startLng) * t;
    u.markerRef.setLatLng([u.lat, u.lng]);
    u.zoneRef.setLatLng([u.lat, u.lng]);

    // Штамп территории каждые N метров (не каждый шаг, чтобы не засорять)
    const now = Date.now();
    if (now - u.lastStamp > 150) { // каждые 150 мс реального времени
      stampPatch(u.sideId, u.lat, u.lng, u.controlRadius);
      u.lastStamp = now;
    }

    if (step >= steps) {
      clearInterval(interval);
      u.moving = false;
      // Финальный штамп
      stampPatch(u.sideId, u.lat, u.lng, u.controlRadius);
      checkBattles();
      checkEncirclement();
    }
  }, (realSec * 1000) / steps);

  updateStatus(`Отряд «${u.name}» движется (${distKm.toFixed(2)} км)`);
}

/* ============================================================
   8. ОКРУЖЕНИЕ
   Если отряд одной стороны отрезан от остальных вражескими пятнами —
   его территория постепенно переходит врагу.
   ============================================================ */
function checkEncirclement() {
  sides.forEach(side => {
    const ownUnits = state.units.filter(u => u.sideId === side.id);
    if (ownUnits.length < 2) return;
    const base = ownUnits.reduce((a, b) => a.strength >= b.strength ? a : b);

    ownUnits.forEach(u => {
      if (u === base) return;
      if (isPathBlocked(u, base)) {
        u.strength -= 4;
        if (u.strength <= 0) {
          // Территория отряда переходит ближайшему врагу
          const enemy = state.units
            .filter(x => x.sideId !== u.sideId)
            .sort((a, b) => map.distance([u.lat, u.lng], [a.lat, a.lng]) -
                            map.distance([u.lat, u.lng], [b.lat, b.lng]))[0];
          if (enemy) {
            // Перекрашиваем все пятна этого отряда в цвет врага
            state.patches.forEach(p => {
              if (map.distance([u.lat, u.lng], [p.lat, p.lng]) < u.controlRadius * 2 &&
                  p.sideId === u.sideId) {
                const side2 = getSide(enemy.sideId);
                p.sideId = enemy.sideId;
                p.layerRef.setStyle({ color: side2.color, fillColor: side2.color });
              }
            });
          }
          removeUnit(u);
          updateStatus(`Отряд «${u.name}» уничтожен в окружении`);
        } else {
          u.markerRef.getPopup()?.setContent(`
            <div class="unit-popup">
              <b>${u.name}</b> (${side.name})<br>
              ⚠️ В ОКРУЖЕНИИ<br>
              Сила: ${u.strength}
            </div>`);
        }
      }
    });
  });
}

function isPathBlocked(a, b) {
  const steps = 14;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const lat = a.lat + (b.lat - a.lat) * t;
    const lng = a.lng + (b.lng - a.lng) * t;
    for (const enemy of state.units) {
      if (enemy.sideId === a.sideId) continue;
      const d = map.distance([lat, lng], [enemy.lat, enemy.lng]);
      if (d < enemy.attackRadius * 0.7) return true;
    }
  }
  return false;
}

setInterval(checkEncirclement, 5000);

/* ============================================================
   9. АРТИЛЛЕРИЯ — радиус удара уменьшен
   ============================================================ */
window.startFire = function(id) {
  const u = state.units.find(x => x.id === id);
  if (!u || u.type !== 'artillery' || u.cooldown > 0) {
    updateStatus('Артиллерия перезаряжается');
    return;
  }
  map.closePopup();
  pendingFireUnit = u;
  updateStatus('Кликните точку удара');
};

map.on('click', e => {
  if (!pendingFireUnit) return;
  const u = pendingFireUnit;
  pendingFireUnit = null;

  const blastRadius = 400; // метров — меньше
  const blast = L.circle(e.latlng, {
    radius: blastRadius,
    color: '#ff5722', fillColor: '#ff5722', fillOpacity: 0.4, weight: 2
  }).addTo(drawLayer);
  setTimeout(() => drawLayer.removeLayer(blast), 1500);

  const toRemove = [];
  state.units.forEach(other => {
    if (other === u) return;
    const d = map.distance(e.latlng, [other.lat, other.lng]);
    if (d <= blastRadius) toRemove.push(other);
  });
  toRemove.forEach(removeUnit);
  if (toRemove.length) updateStatus(`Артиллерия уничтожила ${toRemove.length} отряд(ов)`);

  u.cooldown = 8;
  const t = setInterval(() => {
    u.cooldown--;
    if (u.cooldown <= 0) clearInterval(t);
  }, 1000);
});

/* ============================================================
   10. БОИ
   ============================================================ */
function checkBattles() {
  for (let i = 0; i < state.units.length; i++) {
    for (let j = i + 1; j < state.units.length; j++) {
      const a = state.units[i], b = state.units[j];
      if (a.sideId === b.sideId) continue;
      const d = map.distance([a.lat, a.lng], [b.lat, b.lng]);
      const contact = Math.min(a.attackRadius, b.attackRadius);
      if (d <= contact) {
        if (a.strength > b.strength) {
          b.strength -= 20; a.strength -= 6;
        } else if (b.strength > a.strength) {
          a.strength -= 20; b.strength -= 6;
        } else {
          a.strength -= 12; b.strength -= 12;
        }
        if (a.strength <= 0) removeUnit(a);
        if (b.strength <= 0) removeUnit(b);
      }
    }
  }
}
setInterval(checkBattles, 3000);

/* ============================================================
   11. СОХРАНЕНИЕ
   ============================================================ */
document.getElementById('saveBtn').onclick = () => {
  const data = {
    units: state.units.map(u => ({
      id: u.id, sideId: u.sideId, type: u.type, name: u.name,
      lat: u.lat, lng: u.lng, strength: u.strength,
      controlRadius: u.controlRadius, attackRadius: u.attackRadius
    })),
    forts: state.forts.map(f => ({ sideId: f.sideId, name: f.name, lat: f.lat, lng: f.lng, radius: f.radius })),
    patches: state.patches.map(p => ({ sideId: p.sideId, lat: p.lat, lng: p.lng, radius: p.radius }))
  };
  localStorage.setItem('vologdaSave', JSON.stringify(data));
  updateStatus('Сохранено');
};

document.getElementById('loadBtn').onclick = () => {
  const raw = localStorage.getItem('vologdaSave');
  if (!raw) return updateStatus('Сохранений нет');
  const data = JSON.parse(raw);
  unitsLayer.clearLayers(); fortsLayer.clearLayers(); territoryLayer.clearLayers();
  state.units = []; state.forts = []; state.patches = []; unitIdCounter = 0;

  (data.patches || []).forEach(p => addPatch(p.sideId, p.lat, p.lng, p.radius));
  (data.units || []).forEach(u => {
    const nu = { ...u, moving: false, cooldown: 0, lastStamp: 0,
                 markerRef: null, zoneRef: null, maxStrength: u.type === 'artillery' ? 40 : 100 };
    state.units.push(nu);
    if (u.id > unitIdCounter) unitIdCounter = u.id;
    renderUnit(nu);
  });
  (data.forts || []).forEach(f => createFort(f.lat, f.lng));
  updateStatus('Загружено');
};

document.getElementById('clearAll').onclick = () => {
  if (!confirm('Очистить карту?')) return;
  unitsLayer.clearLayers(); fortsLayer.clearLayers(); territoryLayer.clearLayers();
  state.units = []; state.forts = []; state.patches = [];
};

function updateStatus(text) {
  document.getElementById('status').textContent = text;
}
</script>
</body>
</html>
