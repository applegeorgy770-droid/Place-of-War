<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Вологда — захват по зданиям (исправлено)</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #101820; }
  .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.9) contrast(0.85); }
  #toolbar { position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 5px; flex-wrap: wrap; justify-content: center;
    background: rgba(15,25,40,.95); padding: 7px 9px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08); box-shadow: 0 6px 24px rgba(0,0,0,.5); max-width: 95vw; }
  #toolbar button { background: #1e2a3a; color: #dfe8f2; border: 1px solid #2f4056;
    padding: 6px 9px; border-radius: 8px; cursor: pointer; font-size: 12px; }
  #toolbar button:hover { background: #2a3a4f; }
  #toolbar button.active { background: #2e7d32; border-color: #4caf50; color: #fff; }
  #toolbar button.danger { background: #7a1f1f; border-color: #a83a3a; }
  #side { position: absolute; top: 64px; right: 10px; z-index: 1000; width: 240px;
    background: rgba(15,25,40,.96); color: #dfe8f2; padding: 12px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,.08); font-size: 12px; }
  #side h3 { margin: 0 0 6px; font-size: 13px; }
  #side label { display: block; margin: 6px 0 3px; color: #9fb2c8; }
  #side input, #side select { width: 100%; padding: 5px 7px; border-radius: 6px;
    border: 1px solid #2f4056; background: #0e1826; color: #dfe8f2; font-size: 12px; }
  #side .row { display: flex; gap: 5px; margin-top: 6px; }
  #side .row button { flex: 1; padding: 6px; border-radius: 6px; border: 1px solid #2f4056;
    background: #1e2a3a; color: #dfe8f2; cursor: pointer; font-size: 11px; }
  #status { position: absolute; bottom: 10px; left: 10px; z-index: 1000;
    background: rgba(15,25,40,.95); color: #cfd9e5; padding: 8px 11px; border-radius: 8px;
    font-size: 11px; border: 1px solid rgba(255,255,255,.08); max-width: 400px; line-height: 1.5; }
  .unit-popup button { background: #2e7d32; color: #fff; border: none; padding: 5px 9px;
    border-radius: 4px; cursor: pointer; margin-top: 4px; font-size: 11px; }
  .unit-popup button.fire { background: #b71c1c; }
  .unit-popup button.fire:disabled { background: #555; cursor: not-allowed; opacity: .7; }
</style>
</head>
<body>

<div id="map"></div>

<div id="toolbar">
  <button data-mode="select" class="active">🖱 Выбор</button>
  <button data-mode="unit">⚔ Отряд</button>
  <button data-mode="artillery">🎯 Артиллерия</button>
  <button data-mode="fort">🏰 Укрепление</button>
  <button data-mode="drawTerritory">✏️ Своя территория</button>
  <button data-mode="erase">🗑 Удалить</button>
  <button id="clearAll" class="danger">💥 Очистить</button>
</div>

<div id="side">
  <h3>Сторона</h3>
  <select id="sideSelect"></select>
  <label>Имя отряда</label>
  <input id="nameInput" placeholder="напр. 1-я рота" />
  <label>Скорость (км/мин, игровое)</label>
  <input id="speedInput" type="number" step="0.05" value="0.1" />
  <div class="row">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
  </div>
</div>

<div id="status">Загрузка зданий Вологды из OSM... Подождите.</div>

<script>
/* ============================================================
   1. КАРТА
   ============================================================ */
const VOLOGDA = [59.2205, 39.8915];
const map = L.map('map', {
  worldCopyJump: true, minZoom: 13, maxZoom: 18
}).setView(VOLOGDA, 15);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
}).addTo(map);

/* ============================================================
   2. СТОРОНЫ
   ============================================================ */
const sides = [
  { id: 'red',   name: 'Красные',   color: '#e53935' },
  { id: 'blue',  name: 'Синие',     color: '#1e88e5' },
  { id: 'green', name: 'Зелёные',   color: '#43a047' },
  { id: 'gold',  name: 'Золотые',   color: '#f9a825' }
];
const sideSelect = document.getElementById('sideSelect');
sideSelect.innerHTML = sides.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
function getSide(id) { return sides.find(s => s.id === id) || sides[0]; }

/* ============================================================
   3. СЛОИ
   ============================================================ */
const buildingsLayer = L.layerGroup().addTo(map);
const territoryLayer = L.layerGroup().addTo(map);
const unitsLayer     = L.layerGroup().addTo(map);
const fortsLayer     = L.layerGroup().addTo(map);
const drawLayer      = L.layerGroup().addTo(map);

/* ============================================================
   4. ЗАГРУЗКА ЗДАНИЙ
   ============================================================ */
let allBuildings = [];

async function loadBuildings() {
  const b = map.getBounds().pad(0.05);
  const bbox = `${b.getSouth()},${b.getWest()},${b.getNorth()},${b.getEast()}`;
  const query = `[out:json][timeout:25];(way["building"](${bbox});relation["building"](${bbox}););out body;>;out skel qt;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter', {
      method: 'POST',
      body: 'data=' + encodeURIComponent(query),
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
    });
    const json = await res.json();
    const nodes = {};
    json.elements.forEach(el => { if (el.type === 'node') nodes[el.id] = [el.lon, el.lat]; });

    const features = [];
    json.elements.forEach(el => {
      if (el.type === 'way' && el.nodes && el.nodes.length >= 3) {
        const coords = el.nodes.map(id => nodes[id]).filter(Boolean);
        if (coords.length >= 3) {
          const ring = [...coords, coords[0]];
          const feature = turf.polygon([ring]);
          feature.properties = { sideId: null };
          features.push(feature);
          const latlngs = ring.map(c => [c[1], c[0]]);
          L.polygon(latlngs, {
            color: '#4a5a6f', weight: 0.5, fillColor: '#2a3a4a',
            fillOpacity: 0.15, interactive: false
          }).addTo(buildingsLayer);
        }
      }
    });
    allBuildings = features;
    updateStatus(`Загружено ${features.length} зданий. Можно играть.`);
  } catch(e) {
    updateStatus('Ошибка загрузки зданий. Проверьте интернет.');
    console.error(e);
  }
}
loadBuildings();

/* ============================================================
   5. СОСТОЯНИЕ
   ============================================================ */
const state = {
  units: [], forts: [],
  territory: {}, territoryRefs: {}
};
sides.forEach(s => { state.territory[s.id] = null; });
let unitIdCounter = 0;
let mode = 'select';
let pendingMoveUnit = null;
let pendingFireUnit = null;
let drawPoints = [];
let drawPolyline = null;

/* ============================================================
   6. ТУЛБАР — сбрасываем pending-режимы при смене инструмента
   ============================================================ */
document.getElementById('toolbar').addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  // Сбрасываем всё, что «ждало клика»
  pendingMoveUnit = null;
  pendingFireUnit = null;
  drawPoints = [];
  drawLayer.clearLayers();
  drawPolyline = null;
  map.closePopup();
  document.querySelectorAll('#toolbar button[data-mode]')
    .forEach(b => b.classList.toggle('active', b === btn));
  if (mode === 'drawTerritory') updateStatus('Кликните точки территории, двойной клик — замкнуть');
  else if (mode === 'unit') updateStatus('Кликните на карту, чтобы поставить отряд');
  else if (mode === 'artillery') updateStatus('Кликните на карту, чтобы поставить артиллерию');
  else if (mode === 'fort') updateStatus('Кликните на карту, чтобы поставить укрепление');
  else if (mode === 'erase') updateStatus('Кликните по объекту, чтобы удалить');
  else updateStatus('Выбор');
});

/* ============================================================
   7. ЕДИНЫЙ ОБРАБОТЧИК КЛИКА
   Приоритет: pending move → pending fire → draw → создание объектов
   ============================================================ */
map.on('click', e => {
  // 1) Ожидание точки движения
  if (pendingMoveUnit) {
    const u = pendingMoveUnit;
    pendingMoveUnit = null;
    mode = 'select';
    document.querySelectorAll('#toolbar button[data-mode]')
      .forEach(b => b.classList.toggle('active', b.dataset.mode === 'select'));
    moveUnitTo(u, e.latlng.lat, e.latlng.lng);
    return;
  }

  // 2) Ожидание точки арт-удара
  if (pendingFireUnit) {
    const u = pendingFireUnit;
    pendingFireUnit = null;
    fireAt(u, e.latlng.lat, e.latlng.lng);
    return;
  }

  // 3) Рисование своей территории
  if (mode === 'drawTerritory') {
    drawPoints.push([e.latlng.lat, e.latlng.lng]);
    L.circleMarker(e.latlng, { radius: 4, color: '#fff', fillColor: '#fff' }).addTo(drawLayer);
    if (drawPolyline) drawLayer.removeLayer(drawPolyline);
    if (drawPoints.length > 1) {
      drawPolyline = L.polyline(drawPoints, { color: '#fff', dashArray: '5,5' }).addTo(drawLayer);
    }
    return;
  }

  // 4) Создание объектов
  if (mode === 'unit') {
    createUnit('infantry', e.latlng.lat, e.latlng.lng);
  } else if (mode === 'artillery') {
    createUnit('artillery', e.latlng.lat, e.latlng.lng);
  } else if (mode === 'fort') {
    createFort(e.latlng.lat, e.latlng.lng);
  }
  // 'erase' и 'select' обрабатываются кликами по самим объектам (marker.on)
});

/* ============================================================
   8. ЕДИНЫЙ ОБРАБОТЧИК ДВОЙНОГО КЛИКА
   ============================================================ */
map.on('dblclick', e => {
  if (mode === 'drawTerritory' && drawPoints.length >= 3) {
    const ring = drawPoints.map(p => [p[1], p[0]]);
    ring.push(ring[0]);
    try {
      const poly = turf.polygon([ring]);
      const sideId = sideSelect.value;
      let own = state.territory[sideId];
      try { own = own ? turf.union(own, poly) : poly; } catch(err) { own = own || poly; }
      state.territory[sideId] = own;
      redrawTerritories();
    } catch(err) { console.error(err); }
    drawPoints = [];
    drawLayer.clearLayers();
    drawPolyline = null;
    updateStatus('Территория добавлена');
  }
});

/* ============================================================
   9. ТЕРРИТОРИЯ — ЗАХВАТ ЗДАНИЙ
   ============================================================ */
function captureBuildingsInBrush(sideId, lat, lng, radius) {
  if (!allBuildings.length) return;
  const brush = turf.circle([lng, lat], radius / 1000, { steps: 32, units: 'kilometers' });
  let captured = 0;

  allBuildings.forEach(b => {
    if (!turf.booleanIntersects(b, brush)) return;
    if (b.properties.sideId === sideId) return;

    b.properties.sideId = sideId;
    captured++;

    let own = state.territory[sideId];
    try { own = own ? turf.union(own, b) : b; } catch(e) { own = own || b; }
    state.territory[sideId] = own;

    sides.forEach(s => {
      if (s.id === sideId) return;
      if (!state.territory[s.id]) return;
      try {
        const diff = turf.difference(state.territory[s.id], b);
        state.territory[s.id] = diff;
      } catch(e) {}
    });
  });

  if (captured > 0) {
    redrawTerritories();
    updateStatus(`Захвачено зданий: ${captured}`);
  }
}

function redrawTerritories() {
  sides.forEach(s => {
    const feat = state.territory[s.id];
    const ref = state.territoryRefs[s.id];
    if (!feat) {
      if (ref) { territoryLayer.removeLayer(ref); delete state.territoryRefs[s.id]; }
      return;
    }
    const latlngs = turfToLatLngs(feat);
    if (ref) {
      ref.setLatLngs(latlngs);
      ref.setStyle({ color: s.color, fillColor: s.color });
    } else {
      const poly = L.polygon(latlngs, {
        color: s.color, weight: 2,
        fillColor: s.color, fillOpacity: 0.4
      }).addTo(territoryLayer);
      state.territoryRefs[s.id] = poly;
    }
  });
}

function turfToLatLngs(feat) {
  const g = feat.geometry;
  if (g.type === 'Polygon') return g.coordinates.map(r => r.map(c => [c[1], c[0]]));
  if (g.type === 'MultiPolygon') return g.coordinates.map(p => p.map(r => r.map(c => [c[1], c[0]])));
  return [];
}

/* ============================================================
   10. СОЗДАНИЕ ОТРЯДОВ
   ============================================================ */
function createUnit(type, lat, lng) {
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim() ||
               (type === 'artillery' ? 'Батарея' : 'Отряд');
  const isArt = type === 'artillery';
  const u = {
    id: ++unitIdCounter, sideId, type, name, lat, lng,
    strength: isArt ? 40 : 100,
    maxStrength: isArt ? 40 : 100,
    controlRadius: isArt ? 80 : 120,
    attackRadius: isArt ? 350 : 200,
    cooldown: 0, cooldownTotal: 8,
    moving: false, lastStamp: 0,
    markerRef: null, zoneRef: null
  };
  state.units.push(u);
  renderUnit(u);
  captureBuildingsInBrush(u.sideId, u.lat, u.lng, u.controlRadius);
}

function renderUnit(u) {
  const side = getSide(u.sideId);
  const isArt = u.type === 'artillery';
  const icon = L.divIcon({
    className: '',
    html: `<div class="unit-marker" style="
      width:${isArt ? 24 : 28}px;height:${isArt ? 24 : 28}px;border-radius:50%;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:${isArt ? 12 : 14}px;box-shadow:0 2px 8px rgba(0,0,0,.7);
      transform:translate(-50%,-50%); position:relative;
    ">${isArt ? '🎯' : '⚔'}<span class="cd-badge"></span></div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([u.lat, u.lng], { icon, zIndexOffset: 1000 }).addTo(unitsLayer);
  u.markerRef = marker;

  const zone = L.circle([u.lat, u.lng], {
    radius: u.attackRadius, color: side.color, weight: 1,
    fillColor: side.color, fillOpacity: 0.05, dashArray: '3,4'
  }).addTo(unitsLayer);
  u.zoneRef = zone;

  updatePopup(u);
  marker.on('click', () => { if (mode === 'erase') removeUnit(u); });
}

function updatePopup(u) {
  if (!u.markerRef) return;
  const side = getSide(u.sideId);
  const isArt = u.type === 'artillery';
  const fireDisabled = u.cooldown > 0 ? 'disabled' : '';
  const fireLabel = u.cooldown > 0 ? `Перезарядка (${u.cooldown}с)` : 'Огонь';
  const popup = `<div class="unit-popup">
    <b>${u.name}</b> (${side.name})<br>
    ${isArt ? 'Артиллерия' : 'Пехота'}<br>
    Сила: ${u.strength}/${u.maxStrength}<br>
    <button onclick="startMove(${u.id})">Двигаться</button>
    ${isArt ? `<button class="fire" ${fireDisabled} onclick="startFire(${u.id})">${fireLabel}</button>` : ''}
  </div>`;
  u.markerRef.bindPopup(popup);
  const badge = u.markerRef.getElement()?.querySelector('.cd-badge');
  if (badge) {
    if (u.cooldown > 0) {
      badge.textContent = u.cooldown;
      badge.style.cssText = `position:absolute;top:-5px;right:-5px;
        background:#b71c1c;color:#fff;border-radius:50%;
        width:14px;height:14px;font-size:9px;
        display:flex;align-items:center;justify-content:center;border:1px solid #fff;`;
    } else {
      badge.textContent = ''; badge.style.cssText = 'display:none';
    }
  }
}

function createFort(lat, lng) {
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim() || 'Укрепление';
  const fort = { sideId, name, lat, lng, radius: 150, markerRef: null, zoneRef: null };
  state.forts.push(fort);
  const side = getSide(sideId);
  const icon = L.divIcon({
    className: '',
    html: `<div style="width:26px;height:26px;border-radius:5px;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,.7);
      transform:translate(-50%,-50%);">🏰</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([lat, lng], { icon, zIndexOffset: 900 }).addTo(fortsLayer);
  fort.markerRef = marker;
  const zone = L.circle([lat, lng], {
    radius: fort.radius, color: side.color, weight: 1,
    fillColor: side.color, fillOpacity: 0.1
  }).addTo(fortsLayer);
  fort.zoneRef = zone;
  marker.bindPopup(`<b>${fort.name}</b> (${side.name})`);
  marker.on('click', () => { if (mode === 'erase') removeFort(fort); });
  captureBuildingsInBrush(sideId, lat, lng, fort.radius);
}

function removeUnit(u) {
  u.moving = false;
  if (u.markerRef) unitsLayer.removeLayer(u.markerRef);
  if (u.zoneRef) unitsLayer.removeLayer(u.zoneRef);
  state.units = state.units.filter(x => x !== u);
}
function removeFort(f) {
  if (f.markerRef) fortsLayer.removeLayer(f.markerRef);
  if (f.zoneRef) fortsLayer.removeLayer(f.zoneRef);
  state.forts = state.forts.filter(x => x !== f);
}

/* ============================================================
   11. ДВИЖЕНИЕ
   ============================================================ */
window.startMove = function(id) {
  const u = state.units.find(x => x.id === id);
  if (!u || u.moving) return;
  map.closePopup();
  pendingMoveUnit = u;
  updateStatus('Кликните точку назначения на карте');
};

function moveUnitTo(u, targetLat, targetLng) {
  const startLat = u.lat, startLng = u.lng;
  const distKm = map.distance([startLat, startLng], [targetLat, targetLng]) / 1000;
  const speedKmMin = parseFloat(document.getElementById('speedInput').value) || 0.1;
  const speedKmSec = speedKmMin / 60;
  const travelSec = Math.max(3, distKm / speedKmSec);
  const realSec = Math.max(2, travelSec / 8);

  u.moving = true;
  const steps = Math.min(200, Math.max(20, Math.floor(realSec * 10)));
  let step = 0;

  const interval = setInterval(() => {
    if (!state.units.includes(u)) { clearInterval(interval); return; }
    step++;
    const t = step / steps;
    u.lat = startLat + (targetLat - startLat) * t;
    u.lng = startLng + (targetLng - startLng) * t;
    u.markerRef.setLatLng([u.lat, u.lng]);
    u.zoneRef.setLatLng([u.lat, u.lng]);

    if (Date.now() - u.lastStamp > 250) {
      captureBuildingsInBrush(u.sideId, u.lat, u.lng, u.controlRadius);
      u.lastStamp = Date.now();
    }

    if (step >= steps) {
      clearInterval(interval);
      u.moving = false;
      captureBuildingsInBrush(u.sideId, u.lat, u.lng, u.controlRadius);
      checkBattles();
      checkEncirclement();
    }
  }, (realSec * 1000) / steps);

  updateStatus(`Отряд «${u.name}» движется (${distKm.toFixed(2)} км)`);
}

/* ============================================================
   12. АРТИЛЛЕРИЯ
   ============================================================ */
window.startFire = function(id) {
  const u = state.units.find(x => x.id === id);
  if (!u || u.type !== 'artillery') return;
  if (u.cooldown > 0) { updateStatus(`Перезарядка: ${u.cooldown} с`); return; }
  map.closePopup();
  pendingFireUnit = u;
  updateStatus('Кликните точку удара');
};

function fireAt(u, lat, lng) {
  if (!state.units.includes(u)) return;
  if (u.cooldown > 0) return;

  const blastRadius = 350;
  const blast = L.circle([lat, lng], {
    radius: blastRadius, color: '#ff5722', fillColor: '#ff5722',
    fillOpacity: 0.4, weight: 2
  }).addTo(drawLayer);
  setTimeout(() => drawLayer.removeLayer(blast), 1500);

  const toRemove = [];
  state.units.forEach(other => {
    if (other === u) return;
    if (map.distance([lat, lng], [other.lat, other.lng]) <= blastRadius) toRemove.push(other);
  });
  toRemove.forEach(removeUnit);
  if (toRemove.length) updateStatus(`Артиллерия уничтожила ${toRemove.length} отряд(ов)`);

  u.cooldown = u.cooldownTotal;
  updatePopup(u);
  const t = setInterval(() => {
    u.cooldown--;
    updatePopup(u);
    if (u.cooldown <= 0) clearInterval(t);
  }, 1000);
}

/* ============================================================
   13. ОКРУЖЕНИЕ И БОИ
   ============================================================ */
function checkEncirclement() {
  sides.forEach(side => {
    const ownUnits = state.units.filter(u => u.sideId === side.id);
    if (ownUnits.length < 2) return;
    const base = ownUnits.reduce((a, b) => a.strength >= b.strength ? a : b);

    ownUnits.forEach(u => {
      if (u === base) return;
      if (isPathBlocked(u, base)) {
        u.strength -= 4;
        if (u.strength <= 0) {
          const enemy = state.units
            .filter(x => x.sideId !== u.sideId)
            .sort((a, b) => map.distance([u.lat, u.lng], [a.lat, a.lng]) -
                            map.distance([u.lat, u.lng], [b.lat, b.lng]))[0];
          if (enemy) captureBuildingsInBrush(enemy.sideId, u.lat, u.lng, u.controlRadius * 1.5);
          removeUnit(u);
          updateStatus(`Отряд «${u.name}» уничтожен в окружении`);
        } else {
          updatePopup(u);
        }
      }
    });
  });
}

function isPathBlocked(a, b) {
  const steps = 14;
  for (let i = 1; i < steps; i++) {
    const t = i / steps;
    const lat = a.lat + (b.lat - a.lat) * t;
    const lng = a.lng + (b.lng - a.lng) * t;
    for (const enemy of state.units) {
      if (enemy.sideId === a.sideId) continue;
      if (map.distance([lat, lng], [enemy.lat, enemy.lng]) < enemy.attackRadius * 0.7) return true;
    }
  }
  return false;
}

function checkBattles() {
  for (let i = 0; i < state.units.length; i++) {
    for (let j = i + 1; j < state.units.length; j++) {
      const a = state.units[i], b = state.units[j];
      if (a.sideId === b.sideId) continue;
      const d = map.distance([a.lat, a.lng], [b.lat, b.lng]);
      const contact = Math.min(a.attackRadius, b.attackRadius);
      if (d <= contact) {
        if (a.strength > b.strength) { b.strength -= 20; a.strength -= 6; }
        else if (b.strength > a.strength) { a.strength -= 20; b.strength -= 6; }
        else { a.strength -= 12; b.strength -= 12; }
        if (a.strength <= 0) removeUnit(a);
        if (b.strength <= 0) removeUnit(b);
      }
    }
  }
}
setInterval(checkBattles, 3000);
setInterval(checkEncirclement, 5000);

/* ============================================================
   14. СОХРАНЕНИЕ
   ============================================================ */
document.getElementById('saveBtn').onclick = () => {
  const data = {
    territory: {},
    units: state.units.map(u => ({
      id: u.id, sideId: u.sideId, type: u.type, name: u.name,
      lat: u.lat, lng: u.lng, strength: u.strength,
      controlRadius: u.controlRadius, attackRadius: u.attackRadius,
      cooldown: u.cooldown, cooldownTotal: u.cooldownTotal
    })),
    forts: state.forts.map(f => ({ sideId: f.sideId, name: f.name, lat: f.lat, lng: f.lng, radius: f.radius }))
  };
  sides.forEach(s => { data.territory[s.id] = state.territory[s.id]; });
  localStorage.setItem('vologdaBuildings', JSON.stringify(data));
  updateStatus('Сохранено');
};

document.getElementById('loadBtn').onclick = () => {
  const raw = localStorage.getItem('vologdaBuildings');
  if (!raw) return updateStatus('Сохранений нет');
  const data = JSON.parse(raw);
  unitsLayer.clearLayers(); fortsLayer.clearLayers(); territoryLayer.clearLayers();
  state.units = []; state.forts = []; state.territory = {}; state.territoryRefs = {};
  sides.forEach(s => { state.territory[s.id] = null; });
  unitIdCounter = 0;

  sides.forEach(s => {
    if (data.territory && data.territory[s.id]) state.territory[s.id] = data.territory[s.id];
  });
  redrawTerritories();

  (data.units || []).forEach(u => {
    const nu = { ...u, moving: false, lastStamp: 0, markerRef: null, zoneRef: null,
                 maxStrength: u.type === 'artillery' ? 40 : 100 };
    state.units.push(nu);
    if (u.id > unitIdCounter) unitIdCounter = u.id;
    renderUnit(nu);
  });
  (data.forts || []).forEach(f => createFort(f.lat, f.lng));
  updateStatus('Загружено');
};

document.getElementById('clearAll').onclick = () => {
  if (!confirm('Очистить карту?')) return;
  unitsLayer.clearLayers(); fortsLayer.clearLayers(); territoryLayer.clearLayers();
  state.units = []; state.forts = []; state.territory = {}; state.territoryRefs = {};
  sides.forEach(s => { state.territory[s.id] = null; });
};

function updateStatus(text) {
  document.getElementById('status').textContent = text;
}
</script>
