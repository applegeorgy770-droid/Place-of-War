<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Симулятор захватов мира</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
  #map { position: absolute; inset: 0; background: #0b1a2a; }

  /* Панель инструментов */
  #toolbar {
    position: absolute; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 1000; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
    background: rgba(15,25,40,.92); padding: 8px 10px; border-radius: 12px;
    box-shadow: 0 6px 24px rgba(0,0,0,.4); border: 1px solid rgba(255,255,255,.08);
    backdrop-filter: blur(6px);
  }
  #toolbar button {
    background: #1e2a3a; color: #dfe8f2; border: 1px solid #2f4056;
    padding: 7px 11px; border-radius: 8px; cursor: pointer; font-size: 13px;
    transition: .15s;
  }
  #toolbar button:hover { background: #2a3a4f; }
  #toolbar button.active { background: #2e7d32; border-color: #4caf50; color: #fff; }
  #toolbar button.danger { background: #7a1f1f; border-color: #a83a3a; }

  /* Боковая панель */
  #side {
    position: absolute; top: 70px; right: 12px; z-index: 1000; width: 260px;
    background: rgba(15,25,40,.94); color: #dfe8f2; padding: 14px;
    border-radius: 12px; border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 6px 24px rgba(0,0,0,.4); font-size: 13px;
  }
  #side h3 { margin: 0 0 10px; font-size: 14px; letter-spacing: .3px; }
  #side label { display: block; margin: 8px 0 4px; color: #9fb2c8; }
  #side input, #side select {
    width: 100%; padding: 6px 8px; border-radius: 6px; border: 1px solid #2f4056;
    background: #0e1826; color: #dfe8f2; font-size: 13px;
  }
  #side .row { display: flex; gap: 6px; margin-top: 10px; }
  #side .row button {
    flex: 1; padding: 7px; border-radius: 6px; border: 1px solid #2f4056;
    background: #1e2a3a; color: #dfe8f2; cursor: pointer;
  }
  #side .row button:hover { background: #2a3a4f; }
  .legend-item { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .swatch { width: 16px; height: 16px; border-radius: 4px; flex: none; border: 1px solid rgba(255,255,255,.2); }

  .leaflet-container { background: #0b1a2a; }
  #hint {
    position: absolute; bottom: 12px; left: 12px; z-index: 1000;
    background: rgba(15,25,40,.92); color: #9fb2c8; padding: 8px 12px;
    border-radius: 8px; font-size: 12px; border: 1px solid rgba(255,255,255,.08);
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="toolbar">
  <button data-mode="select" class="active">🖱 Выбор</button>
  <button data-mode="territory">🟩 Территория</button>
  <button data-mode="unit">🎖 Войска</button>
  <button data-mode="arrow">➡️ Стрелка</button>
  <button data-mode="fort">🏰 Укрепление</button>
  <button data-mode="erase">🗑 Удалить</button>
  <button id="clearAll" class="danger">💥 Очистить всё</button>
</div>

<div id="side">
  <h3>Сторона</h3>
  <select id="sideSelect"></select>
  <label>Имя (для юнита / укрепления)</label>
  <input id="nameInput" placeholder="напр. 3-я бригада" />

  <h3 style="margin-top:16px">Легенда</h3>
  <div id="legend"></div>

  <div class="row">
    <button id="saveBtn">💾 Сохранить</button>
    <button id="loadBtn">📂 Загрузить</button>
  </div>
  <div class="row">
    <button id="exportBtn">⬇️ Экспорт JSON</button>
  </div>
</div>

<div id="hint">Колесо — зум, перетаскивание карты. Выберите инструмент выше.</div>

<script>
/* ============================================================
   ИНИЦИАЛИЗАЦИЯ КАРТЫ
   ============================================================ */
const map = L.map('map', {
  worldCopyJump: true,
  minZoom: 2,
  maxZoom: 12,
  zoomControl: true
}).setView([20, 0], 3);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

/* ============================================================
   СТОРОНЫ (ФРАКЦИИ)
   ============================================================ */
let sides = [
  { id: 'red',   name: 'Красные',   color: '#e53935' },
  { id: 'blue',  name: 'Синие',     color: '#1e88e5' },
  { id: 'green', name: 'Зелёные',   color: '#43a047' },
  { id: 'gold',  name: 'Золотые',   color: '#f9a825' }
];

const sideSelect = document.getElementById('sideSelect');
const legendEl = document.getElementById('legend');

function renderSides() {
  sideSelect.innerHTML = sides.map(s =>
    `<option value="${s.id}">${s.name}</option>`).join('');
  legendEl.innerHTML = sides.map(s =>
    `<div class="legend-item"><div class="swatch" style="background:${s.color}"></div>${s.name}</div>`
  ).join('');
}
renderSides();

function getSide(id) { return sides.find(s => s.id === id) || sides[0]; }

/* ============================================================
   РЕЖИМ РАБОТЫ
   ============================================================ */
let mode = 'select';
const toolbar = document.getElementById('toolbar');
toolbar.addEventListener('click', e => {
  const btn = e.target.closest('button[data-mode]');
  if (!btn) return;
  mode = btn.dataset.mode;
  [...toolbar.querySelectorAll('button[data-mode]')]
    .forEach(b => b.classList.toggle('active', b === btn));
  cancelDrawing();
});

/* ============================================================
   СЛОИ
   ============================================================ */
const territoriesLayer = L.layerGroup().addTo(map);
const unitsLayer       = L.layerGroup().addTo(map);
const arrowsLayer      = L.layerGroup().addTo(map);
const fortsLayer       = L.layerGroup().addTo(map);
const drawLayer        = L.layerGroup().addTo(map); // временный слой рисования

/* ============================================================
   СОСТОЯНИЕ
   ============================================================ */
const state = {
  territories: [], // { sideId, latlngs:[[lat,lng],...] }
  units:       [], // { sideId, name, lat, lng }
  arrows:      [], // { sideId, from:[lat,lng], to:[lat,lng] }
  forts:       []  // { sideId, name, lat, lng }
};

/* ============================================================
   ИНСТРУМЕНТ: ТЕРРИТОРИЯ (клик по точкам, двойной — завершить)
   ============================================================ */
let tempPoints = [];
let tempPolyline = null;
let tempMarkers = [];

function cancelDrawing() {
  tempPoints = [];
  drawLayer.clearLayers();
  tempPolyline = null;
  tempMarkers = [];
}

map.on('click', e => {
  const ll = e.latlng;

  if (mode === 'territory') {
    tempPoints.push([ll.lat, ll.lng]);
    const dot = L.circleMarker(ll, {
      radius: 4, color: '#fff', weight: 1, fillColor: '#fff', fillOpacity: 1
    }).addTo(drawLayer);
    tempMarkers.push(dot);
    if (tempPolyline) drawLayer.removeLayer(tempPolyline);
    tempPolyline = L.polyline(tempPoints, {
      color: '#ffffff', weight: 2, dashArray: '5,5'
    }).addTo(drawLayer);
  }

  if (mode === 'arrow') {
    if (!tempPoints.length) {
      tempPoints.push([ll.lat, ll.lng]);
      L.circleMarker(ll, { radius: 5, color: '#fff', fillColor: '#fff' }).addTo(drawLayer);
    } else {
      const from = tempPoints[0];
      const to = [ll.lat, ll.lng];
      const sideId = sideSelect.value;
      const arrow = { sideId, from, to };
      state.arrows.push(arrow);
      drawArrow(arrow);
      cancelDrawing();
    }
  }
});

map.on('dblclick', e => {
  if (mode === 'territory' && tempPoints.length >= 3) {
    const sideId = sideSelect.value;
    const territory = { sideId, latlngs: tempPoints.slice() };
    state.territories.push(territory);
    drawTerritory(territory);
    cancelDrawing();
  }
  if (mode === 'arrow') cancelDrawing();
});

/* ============================================================
   ИНСТРУМЕНТ: ЮНИТ / УКРЕПЛЕНИЕ (клик)
   ============================================================ */
map.on('click', e => {
  const ll = e.latlng;
  const sideId = sideSelect.value;
  const name = document.getElementById('nameInput').value.trim();

  if (mode === 'unit') {
    const unit = { sideId, name: name || 'Войска', lat: ll.lat, lng: ll.lng };
    state.units.push(unit);
    drawUnit(unit);
  }

  if (mode === 'fort') {
    const fort = { sideId, name: name || 'Укрепление', lat: ll.lat, lng: ll.lng };
    state.forts.push(fort);
    drawFort(fort);
  }
});

/* ============================================================
   ОТРИСОВКА ЭЛЕМЕНТОВ
   ============================================================ */
function drawTerritory(t) {
  const side = getSide(t.sideId);
  const poly = L.polygon(t.latlngs, {
    color: side.color, weight: 2,
    fillColor: side.color, fillOpacity: 0.30
  }).addTo(territoriesLayer);
  poly._data = t;
  poly.on('click', ev => {
    if (mode === 'erase') {
      territoriesLayer.removeLayer(poly);
      state.territories = state.territories.filter(x => x !== t);
    }
    if (mode === 'select') {
      L.popup().setLatLng(ev.latlng)
        .setContent(`<b>${side.name}</b><br>Территория`)
        .openOn(map);
    }
  });
}

function drawUnit(u) {
  const side = getSide(u.sideId);
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:34px;height:34px;border-radius:50%;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.5);
      transform:translate(-50%,-50%);
    ">⚔</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([u.lat, u.lng], { icon }).addTo(unitsLayer);
  marker.bindTooltip(`${u.name} (${side.name})`, { direction: 'top', offset: [0,-16] });
  marker._data = u;
  marker.on('click', () => {
    if (mode === 'erase') {
      unitsLayer.removeLayer(marker);
      state.units = state.units.filter(x => x !== u);
    }
  });
}

function drawFort(f) {
  const side = getSide(f.sideId);
  const icon = L.divIcon({
    className: '',
    html: `<div style="
      width:30px;height:30px;border-radius:6px;
      background:${side.color};border:2px solid #fff;
      display:flex;align-items:center;justify-content:center;
      font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.5);
      transform:translate(-50%,-50%);
    ">🏰</div>`,
    iconSize: [0,0]
  });
  const marker = L.marker([f.lat, f.lng], { icon }).addTo(fortsLayer);
  marker.bindTooltip(`${f.name} (${side.name})`, { direction: 'top', offset: [0,-16] });
  marker._data = f;
  marker.on('click', () => {
    if (mode === 'erase') {
      fortsLayer.removeLayer(marker);
      state.forts = state.forts.filter(x => x !== f);
    }
  });
}

/* --- Стрелка на canvas-подобном SVG-слое Leaflet --- */
function drawArrow(a) {
  const side = getSide(a.sideId);
  const line = L.polyline([a.from, a.to], {
    color: side.color, weight: 4, opacity: .9
  }).addTo(arrowsLayer);

  // Стрелка-наконечник
  const fromP = map.latLngToContainerPoint(a.from);
  const toP   = map.latLngToContainerPoint(a.to);
  const angle = Math.atan2(toP.y - fromP.y, toP.x - fromP.x);
  const size  = 14;
  const left  = toP.clone().add(
    L.point(-size * Math.cos(angle - Math.PI/7), -size * Math.sin(angle - Math.PI/7)));
  const right = toP.clone().add(
    L.point(-size * Math.cos(angle + Math.PI/7), -size * Math.sin(angle + Math.PI/7)));

  const latlngLeft  = map.containerPointToLatLng(left);
  const latlngRight = map.containerPointToLatLng(right);

  const head = L.polygon([a.to, latlngLeft, latlngRight], {
    color: side.color, fillColor: side.color, fillOpacity: 1, weight: 1
  }).addTo(arrowsLayer);

  line._data = a; head._data = a;
  const remove = () => {
    arrowsLayer.removeLayer(line);
    arrowsLayer.removeLayer(head);
    state.arrows = state.arrows.filter(x => x !== a);
  };
  line.on('click', () => { if (mode === 'erase') remove(); });
  head.on('click', () => { if (mode === 'erase') remove(); });
}

/* ============================================================
   СОХРАНЕНИЕ / ЗАГРУЗКА
   ============================================================ */
function saveToStorage() {
  localStorage.setItem('worldConquestSave', JSON.stringify({
    sides, state
  }));
  alert('Сохранено в localStorage');
}
function loadFromStorage() {
  const raw = localStorage.getItem('worldConquestSave');
  if (!raw) { alert('Сохранений нет'); return; }
  try { applyData(JSON.parse(raw)); } catch(e) { alert('Ошибка загрузки'); }
}
function exportJSON() {
  const data = JSON.stringify({ sides, state }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'conquest-map.json';
  a.click();
}

function applyData(data) {
  if (data.sides) { sides = data.sides; renderSides(); }
  // очистка
  territoriesLayer.clearLayers(); unitsLayer.clearLayers();
  arrowsLayer.clearLayers(); fortsLayer.clearLayers();
  state.territories = []; state.units = []; state.arrows = []; state.forts = [];

  if (data.state) {
    data.state.territories?.forEach(t => { state.territories.push(t); drawTerritory(t); });
    data.state.units?.forEach(u =>       { state.units.push(u);       drawUnit(u); });
    data.state.arrows?.forEach(a =>      { state.arrows.push(a);      drawArrow(a); });
    data.state.forts?.forEach(f =>       { state.forts.push(f);       drawFort(f); });
  }
}

document.getElementById('saveBtn').onclick   = saveToStorage;
document.getElementById('loadBtn').onclick   = loadFromStorage;
document.getElementById('exportBtn').onclick = exportJSON;

/* Импорт через drag&drop JSON */
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', e => {
  e.preventDefault();
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try { applyData(JSON.parse(ev.target.result)); }
    catch { alert('Неверный JSON'); }
  };
  reader.readAsText(file);
});

/* ============================================================
   ОЧИСТКА
   ============================================================ */
document.getElementById('clearAll').onclick = () => {
  if (!confirm('Удалить все объекты с карты?')) return;
  territoriesLayer.clearLayers(); unitsLayer.clearLayers();
  arrowsLayer.clearLayers(); fortsLayer.clearLayers();
  state.territories = []; state.units = []; state.arrows = []; state.forts = [];
};

/* ============================================================
   ПЕРЕРИСОВКА СТРЕЛОК ПРИ ЗУМЕ (наконечники зависят от пикселей)
   ============================================================ */
map.on('zoomend', () => {
  arrowsLayer.clearLayers();
  state.arrows.forEach(a => drawArrow(a));
});
</script>
</body>
</html>
